# Application mobile iOS — lot 95 (CDC 12 §28-§29, décisions PO M4, M7, M8),
# lot 108G (décision PO du 03/11/2026 : interface DISTANTE = cible V1).
#
# Mode distant par défaut en préproduction ET en production. La sonde technique
# du Gate 0 (mode local) n'est admise qu'en préproduction, en compilation seule :
# elle est refusée avant le build (readiness) et le binaire est contrôlé avant
# tout envoi (scripts/distribution-guard.mjs).
#
# Indépendant de la CI web (.github/workflows/ci.yml, inchangé). Compilation sur
# runner macOS (Xcode), signature automatique par clé d'API App Store Connect
# (aucun certificat ni profil dans le dépôt), envoi direct à TestFlight.
#   · préproduction (fr.verebona.app.preprod) → TestFlight, testeurs autorisés ;
#   · production (fr.verebona.app) → UNIQUEMENT à la main, derrière l'environnement
#     protégé « production-mobile » (approbation du PO) ; le build arrive dans
#     TestFlight de l'app de production. La SOUMISSION à l'App Store et la
#     PUBLICATION (« publication manuelle » dans App Store Connect) restent deux
#     gestes manuels distincts du PO : ce workflow ne publie jamais rien.
# Secrets et variables : docs/mobile/builds-et-secrets.md.
name: Mobile — iOS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement de l'application"
        type: choice
        options: [preprod, prod]
        default: preprod
      ui_mode:
        description: "Mode d'affichage : remote = interface distante (cible V1, défaut) ; local = sonde technique Gate 0 (préproduction, compilation seule, jamais envoyée)"
        type: choice
        options: [remote, local]
        default: remote
      publish:
        description: "Envoyer à App Store Connect / TestFlight (sinon : compilation seule)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/lib/native/**"
      - "src/lib/mobile/app-links.ts"
      - ".github/workflows/mobile-ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "src/lib/native/**"
      - "src/lib/mobile/app-links.ts"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}-${{ inputs.environment || 'preprod' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Contrôles (projet mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - working-directory: mobile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - working-directory: mobile
        run: npm run check

  # Correctif 29/10/2026 : voir mobile-android.yml (job « readiness ») — build
  # sauté sur push tant que la configuration n'est pas posée, échec explicite
  # sur lancement manuel. Contrôle sur runner Linux (évite un runner macOS inutile).
  readiness:
    name: Configuration de l'environnement posée ?
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'production-mobile' || 'mobile-preprod' }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mobile
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - id: check
        working-directory: mobile
        env:
          VEREBONA_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'preprod' }}
          VEREBONA_APP_ORIGIN: ${{ vars.VEREBONA_APP_ORIGIN }}
          VEREBONA_APP_VERSION: ${{ vars.VEREBONA_APP_VERSION }}
          VEREBONA_UI_MODE: ${{ inputs.ui_mode || 'remote' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        # Lot 108G : --publish → une sonde technique (mode local) est refusée ici.
        run: >-
          node scripts/readiness.mjs ios
          ${{ github.event_name == 'workflow_dispatch' && '--strict' || '' }}
          ${{ (github.event_name == 'push' || inputs.publish) && '--publish' || '' }}

  build:
    name: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'Production → TestFlight de l’app de production (approbation requise, aucune publication)' || 'Préproduction → TestFlight' }}
    needs: [checks, readiness]
    if: github.event_name != 'pull_request' && needs.readiness.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    # Préproduction : environnement « mobile-preprod ».
    # Production : environnement PROTÉGÉ « production-mobile » (réviseurs obligatoires).
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'production-mobile' || 'mobile-preprod' }}
    env:
      VEREBONA_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'prod' || 'preprod' }}
      VEREBONA_APP_ORIGIN: ${{ vars.VEREBONA_APP_ORIGIN }}
      # Production : toujours le mode distant (la sonde n'existe qu'en préproduction).
      VEREBONA_UI_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'remote' || (inputs.ui_mode || 'remote') }}
      VEREBONA_APP_VERSION: ${{ vars.VEREBONA_APP_VERSION }}
      VEREBONA_APP_BUILD: ${{ github.run_number }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - name: Dépendances
        working-directory: mobile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Préparer le build de l'environnement + synchroniser le projet natif
        working-directory: mobile
        run: npm run sync -- ios
      - name: Firebase (push) et clé d'API App Store Connect — depuis les secrets
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        # Lot 101 : chaque secret est accepté en base64 OU collé tel quel, puis
        # CONTRÔLÉ avant Xcode, avec un message explicite (aucun contenu affiché).
        run: |
          set -euo pipefail
          ecrire() { # $1 valeur, $2 fichier, $3 début attendu du contenu en clair
            local v; v="$(printf '%s' "$1" | tr -d '\r')"
            if printf '%s' "$v" | head -c 64 | grep -q -- "$3"; then printf '%s\n' "$v" > "$2"
            else printf '%s' "$v" | tr -d ' \n\t' | base64 --decode > "$2" 2>/dev/null || : ; fi
          }
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          ecrire "$ASC_API_KEY_P8_BASE64" "$KEY" "BEGIN PRIVATE KEY"
          ecrire "$GOOGLE_SERVICE_INFO_PLIST_BASE64" mobile/ios/App/App/GoogleService-Info.plist "<?xml"
          ok=1
          # Lot 107-bis : espaces, retours à la ligne et guillemets collés avec la
          # valeur sont retirés ; diagnostic sans jamais afficher la valeur.
          nettoyer() { printf '%s' "$1" | tr -d ' \t\r\n"'"'"; }
          ASC_API_KEY_ID="$(nettoyer "$ASC_API_KEY_ID")"
          ASC_API_ISSUER_ID="$(nettoyer "$ASC_API_ISSUER_ID")"
          if ! [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then echo "::error::ASC_API_KEY_ID : 10 caractères (lettres majuscules et chiffres) attendus — c'est le Key ID affiché sur la ligne de la clé dans App Store Connect › Utilisateurs et accès › Intégrations (valeur reçue : ${#ASC_API_KEY_ID} caractères)."; ok=0; fi
          if ! [[ "$ASC_API_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            n=${#ASC_API_ISSUER_ID}; t=$(printf '%s' "$ASC_API_ISSUER_ID" | tr -cd '-' | wc -c | tr -d ' ')
            if [ "$n" = 0 ]; then why="secret vide ou absent pour l'environnement GitHub « mobile-preprod » / « production-mobile » (un secret d'environnement remplace celui du dépôt)"
            elif [[ "$ASC_API_ISSUER_ID" =~ ^[A-Z0-9]{10}$ ]]; then why="la valeur a 10 caractères : c'est probablement le Key ID ou le Team ID, pas l'Issuer ID"
            else why="valeur reçue : $n caractères dont $t tirets (attendu : 36 caractères dont 4 tirets)"; fi
            echo "::error::ASC_API_ISSUER_ID : identifiant de la forme xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx attendu (Issuer ID, en haut de la page App Store Connect › Utilisateurs et accès › Intégrations › Clés d'équipe) — $why."; ok=0
          fi
          if ! head -1 "$KEY" | grep -q -- "-----BEGIN PRIVATE KEY-----" || ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            if head -c 64 "$KEY" | grep -q "<?xml\|plist"; then echo "::error::ASC_API_KEY_P8_BASE64 contient un fichier plist (GoogleService-Info.plist ?) au lieu de la clé AuthKey_….p8 de l'API App Store Connect."
            else echo "::error::ASC_API_KEY_P8_BASE64 ne contient pas une clé privée lisible : utiliser le fichier AuthKey_<KeyID>.p8 de la clé d'API App Store Connect (pas celle de Sign in with Apple), en base64 ou collé tel quel."; fi
            ok=0
          fi
          if ! plutil -lint -s mobile/ios/App/App/GoogleService-Info.plist >/dev/null 2>&1; then echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 ne contient pas un fichier GoogleService-Info.plist valide (Firebase › Paramètres du projet › app iOS)."; ok=0; fi
          [ "$ok" = 1 ] || exit 1
          echo "::add-mask::$ASC_API_ISSUER_ID"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          # Valeurs nettoyées transmises aux étapes suivantes (sans env: d'étape qui les écraserait).
          echo "ASC_API_KEY_ID=$ASC_API_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_API_ISSUER_ID=$ASC_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "Clé d'API et fichier Firebase contrôlés."
          plutil -replace teamID -string "$APPLE_TEAM_ID" mobile/ios/ExportOptions.plist
      - name: Appareil iOS pour la signature automatique (créé une fois si l'équipe n'en a aucun)
        run: node mobile/scripts/asc-ensure-device.mjs
      - name: Archiver (signature automatique, App Store Connect)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive
      # Lot 111P : jeton d'import partagé app ↔ extension par le Keychain du
      # GROUPE D'APPS (kSecAttrAccessGroup = group.<id de l'app>). Contrôle des
      # droits RÉELLEMENT signés (pas des .entitlements versionnés) : même
      # groupe d'apps et même équipe dans les deux binaires ; un éventuel
      # keychain-access-groups (Keychain Sharing) ne doit pas exclure le groupe
      # utilisé. Les valeurs relevées sont écrites dans le résumé (recette 111P).
      - name: Garde-fou — droits signés du partage (groupe d'apps, Keychain)
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          EXT="$APP/PlugIns/ShareExtension.appex"
          [ -d "$EXT" ] || { echo "::error::Envoi refusé — extension de partage absente du binaire."; exit 1; }
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          GROUP="group.$APP_ID"
          teams=""
          for b in "$APP" "$EXT"; do
            name=$(basename "$b")
            ent="$RUNNER_TEMP/ent-$name.plist"
            codesign -d --entitlements - --xml "$b" > "$ent" 2>/dev/null || { echo "::error::Envoi refusé — droits signés illisibles pour $name."; exit 1; }
            groups=$(plutil -extract com.apple.security.application-groups xml1 -o - "$ent" 2>/dev/null | grep -o '<string>[^<]*</string>' | sed 's/<[^>]*>//g' || true)
            if ! printf '%s\n' "$groups" | grep -qx "$GROUP"; then
              echo "::error::Envoi refusé — $GROUP absent de com.apple.security.application-groups (droits signés de $name : ${groups:-aucun}). Cocher le groupe d'apps sur l'identifiant de $name (developer.apple.com › Identifiers)."; exit 1
            fi
            plist_group=$(/usr/libexec/PlistBuddy -c 'Print VBAppGroup' "$b/Info.plist" 2>/dev/null || true)
            if [ "$plist_group" != "$GROUP" ]; then echo "::error::Envoi refusé — VBAppGroup de $name ($plist_group) différent de $GROUP."; exit 1; fi
            kag=$(plutil -extract keychain-access-groups xml1 -o - "$ent" 2>/dev/null | grep -o '<string>[^<]*</string>' | sed 's/<[^>]*>//g' | tr '\n' ' ' || true)
            team=$(plutil -extract com.apple.developer.team-identifier raw -o - "$ent" 2>/dev/null || true)
            teams="$teams $team"
            echo "$name : application-groups=[$(printf '%s ' $groups)] keychain-access-groups=[${kag}] équipe=${team:-?}"
            # Lot 111 (correctif) : pas d'apostrophe dans ${var:-…} entre guillemets — le bash 3.2 de macOS la prend pour un guillemet ouvrant.
            kag_txt="$kag"; [ -n "$kag_txt" ] || kag_txt="aucun (le groupe d'apps sert de groupe Keychain)"
            echo "- $name : groupe d'apps $GROUP ✓ · keychain-access-groups : $kag_txt · équipe ${team:-?}" >> "$GITHUB_STEP_SUMMARY"
          done
          set -- $teams
          if [ "$#" -eq 2 ] && [ "$1" != "$2" ]; then echo "::error::Envoi refusé — app et extension signées par deux équipes différentes ($1 / $2) : Keychain non partagé."; exit 1; fi
          echo "Droits signés du partage contrôlés : $GROUP dans l'app et l'extension."
      # Lot 108G (CA02) : c'est le BINAIRE archivé qui est contrôlé (configuration
      # Capacitor réellement embarquée, absence de sonde, extension de partage
      # intégrée avec son identifiant et son groupe d'apps) avant tout envoi.
      - name: Garde-fou — binaire distribuable (interface distante, extension de partage)
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          node mobile/scripts/distribution-guard.mjs "$APP/capacitor.config.json" "$APP/public"
          EXT="$APP/PlugIns/ShareExtension.appex"
          if [ ! -d "$EXT" ]; then echo "::error::Envoi refusé — extension de partage absente du binaire (cible ShareExtension)."; exit 1; fi
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXT/Info.plist")
          if [ "$EXT_ID" != "$APP_ID.ShareExtension" ]; then echo "::error::Envoi refusé — identifiant de l'extension ($EXT_ID) non dérivé de celui de l'app ($APP_ID)."; exit 1; fi
          for b in "$APP" "$EXT"; do
            if ! codesign -d --entitlements - --xml "$b" 2>/dev/null | grep -q "group.$APP_ID"; then
              echo "::error::Envoi refusé — groupe d'apps group.$APP_ID absent des droits signés de $(basename "$b")."; exit 1
            fi
          done
          echo "Extension de partage intégrée : $EXT_ID (groupe group.$APP_ID)."
          # Lot 111E : remplissage automatique des mots de passe — le binaire
          # SIGNÉ doit déclarer webcredentials:<hôte exact de l'environnement>
          # (sinon iOS n'affiche que « Mots de passe », sans suggestion).
          HOST=$(sed -n 's/^VB_APP_HOST = //p' mobile/ios/Verebona.xcconfig)
          if [ -z "$HOST" ] || ! codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "webcredentials:$HOST<"; then
            echo "::error::Envoi refusé — webcredentials:$HOST absent des droits signés de l'app (Associated Domains)."; exit 1
          fi
          echo "Droits signés : applinks + webcredentials:$HOST."
      - name: Envoyer à App Store Connect (TestFlight)
        if: github.event_name == 'push' || inputs.publish
        working-directory: mobile/ios/App
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ../ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
      - name: Symboles de débogage (BUILD-08, diagnostic des plantages)
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/App.xcarchive/dSYMs" ]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive/dSYMs" "$RUNNER_TEMP/dSYMs.zip"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ env.VEREBONA_ENV }}-${{ env.VEREBONA_APP_VERSION }}-${{ github.run_number }}-dsyms
          path: ${{ runner.temp }}/dSYMs.zip
          if-no-files-found: ignore
          retention-days: ${{ env.VEREBONA_ENV == 'prod' && 400 || 90 }}
      - name: Résumé — ce que ce workflow n'a PAS fait
        if: success()
        run: |
          {
            echo "### iOS ${VEREBONA_ENV} — interface ${VEREBONA_UI_MODE}"
            echo "- Build $VEREBONA_APP_VERSION ($VEREBONA_APP_BUILD) : TestFlight uniquement (si « publish »)."
            echo "- Aucune soumission à la revue App Store, aucune publication : gestes manuels du PO dans App Store Connect (publication manuelle)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Nettoyer les fichiers sensibles du poste de build
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/asc_api_key.p8" mobile/ios/App/App/GoogleService-Info.plist
