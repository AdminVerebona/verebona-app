  # Informatif : série complète après fusion sur main (et à la demande depuis l'onglet
  # Actions si `workflow_dispatch:` est ajouté sous `on:`). Jamais exigé avant fusion.
  e2e-complet:
    name: E2E série complète (PostgreSQL 16)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Installation
        run: npm ci
      - name: Série E2E complète (une base par fichier, ordre fixe)
        run: npm run test:e2e -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-complet.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-e2e-complet
          path: rapports/
          retention-days: 30
