  e2e-ia:
    name: "E2E IA : conformité des prompts et appels T3 (PostgreSQL 16)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
