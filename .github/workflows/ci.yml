      - name: Socle serveur de l'application mobile, dépôt idempotent (lot 97)
        run: npm run test:e2e:mobile -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-mobile.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
