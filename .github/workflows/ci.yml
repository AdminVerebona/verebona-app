        run: npm run test:e2e:rattachement-adresse -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-rattachement-adresse.xml
      - name: T6 mascotte — appels évités, rattachement à l’exécution T6, doublons, causes d’erreur (lot 113AO, Trello #748)
        run: npm run test:e2e:t6-appels -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-t6-appels.xml
      - name: Opérations — contradictions d’attributs par rôle et diagnostic BO #12 (lot 113AQ, Trello #750 #751)
