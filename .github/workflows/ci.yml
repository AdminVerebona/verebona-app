      - name: Exports BO, export de recette et restauration (lots 75N, 82E)
        run: npm run test:e2e:bo-exports -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-bo-exports.xml
      - name: Diagnostics BO durables — file, reprise, validation, historique (lot 107G)
        run: npm run test:e2e:diagnostics-bo -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-diagnostics-bo.xml
      - uses: actions/upload-artifact@v4
