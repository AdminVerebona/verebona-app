          cache: npm
      - name: Installation
        run: npm ci
      - name: Conformité automatique des prompts, qualification (lots 86A, 88B, 91B, 99B)
        run: npm run test:e2e:conformite-prompts -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-conformite-prompts.xml
      - name: Appels T3 redondants, cache d'idempotence (lot 99A)
        run: npm run test:e2e:t3-appels -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-t3-appels.xml
      - name: Corpus de qualification, verrou A1, stress E2E métier (lot 100B)
        run: npm run test:e2e:corpus-ia -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-corpus-ia.xml
      - name: Assistant T2 — continuité conversationnelle, série d'un équipement (lot 101A)
