    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - name: Installation
        run: npm ci
      - name: Scénarios E2E mascotte et T6 (lots 71F, 71G, 72A, 75E, 76A, 78C, 81B)
        run: npm run test:e2e:mascotte-t6

  e2e-tco:
    name: E2E TCO (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - name: Installation
        run: npm ci
      - name: Scénarios E2E TCO (lots 61, 75D, 76G, 78B, 80A, 81D, 108C)
        run: npm run test:e2e:tco

  conformity-report:
    name: Rapport de conformité
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - run: npm ci
      - name: Génération de l'inventaire
        run: npx tsx scripts/ai-inventory.ts --json > ai-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: inventaire-usages-ia
          # Conservation longue : c'est la preuve opposable du §8.1.
          path: |
            ai-inventory.json
            scripts/ai-legacy-baseline.json
          retention-days: 365

  # ── Lot 100A : contrôles E2E bloquants (docs/exploitation/ci-tests-bloquants.md) ──
  e2e-auth:
    name: E2E sessions, Google/Apple et sécurité (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Installation
        run: npm ci
      - name: Sessions, réauthentification, appareils (lots 37, 53A, 57A, 79C, 92, 96A, 96B)
        run: npm run test:e2e:auth -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-auth.xml
      - name: Connexion Google / Apple et liaison application (lots 93, 96B, 97B)
        run: npm run test:e2e:auth-social -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-auth-social.xml
      - name: MFA et clés d’accès, environnement, disponibilité serveur, messages (lot 111W)
        run: npm run test:e2e:mfa-preprod -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-mfa-preprod.xml
      - name: Inscription, e-mails jetables Google / Apple et supervision du référentiel (lots 109F + 113H, Trello #707)
        run: npm run test:e2e:emails-jetables -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-emails-jetables.xml
      - name: Isolation entre comptes (lots 40, 49, 53A, 53B, 54B, 83D)
        run: npm run test:security:e2e -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-securite.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-e2e-auth
          path: rapports/
          retention-days: 30

