      - name: Mes documents — filtres repliables, dates du document et d'ajout (lot 103F)
        run: npm run test:e2e:filtres-documents -- --reporter=default --reporter=junit --outputFile.junit=rapports/e2e-filtres-documents.xml
      - name: Compte technique de qualification IA, reprise automatique (lot 103G)
