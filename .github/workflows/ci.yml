# ──────────────────────────────────────────────────────────────────────────────
# Intégration continue — CDC §12, critères d'acceptation n°22 et 23.
#
# ⚠️ CORRECTION DU LOT 0. La version précédente fixait AI_MIGRATION_PHASE à 7 :
# tous les contrôles d'extinction étaient actifs alors qu'aucun lot de bascule
# n'avait commencé. Résultat : 26 violations, CI rouge en permanence, et aucune
# pull request mergeable pendant les mois du chantier. Un garde-fou toujours
# rouge n'est pas un garde-fou.
#
# La phase est désormais une variable de dépôt (Settings → Variables), avancée
# explicitement à la fin de chaque lot. Valeur cible finale : 7. C'est cette
# configuration qui doit être en place au moment de la bascule réglementaire.
#
# Le contrôle anti-réintroduction fonctionne par cliquet : la dette connue
# (`scripts/ai-legacy-baseline.json`) ne casse pas le build, toute violation
# nouvelle le casse. Voir l'en-tête de `scripts/check-legacy-ai.mjs`.
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Phase du chantier. À incrémenter à la clôture de chaque lot, jamais avant.
  # Lot 0 terminé ⇒ 1.
  AI_MIGRATION_PHASE: ${{ vars.AI_MIGRATION_PHASE || '1' }}

jobs:
  quality:
    name: Qualité et conformité IA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs

      # Vérifié le 30/07/2026 : `package-lock.json` résout l'intégralité de ses
      # paquets vers registry.npmjs.org, et `npm ci` aboutit sur un runner
      # GitHub standard. L'avertissement précédent, qui annonçait un échec sur
      # un miroir interne (nexus.intra.agrial.net), ne correspondait plus au
      # dépôt : ce miroir n'apparaît nulle part dans le lock. Aucun runner
      # auto-hébergé n'est nécessaire.
      - name: Installation
        run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Lint — interdiction d'accès direct au SDK (critère n°4)
        run: npm run lint

      - name: Tests unitaires et de non-régression (critère n°22)
        run: npm run test:run

      - name: Inventaire d'exécution — exactement cinq usages (critère n°1)
        run: npx tsx scripts/ai-inventory.ts

      # `--strict` : la référence de dette doit être à jour. Un développeur qui
      # supprime un moteur historique doit régénérer le fichier (`npm run
      # ai:baseline`), faute de quoi la violation resterait tolérée par erreur.
      - name: Anti-réintroduction des moteurs historiques (critère n°23)
        run: node scripts/check-legacy-ai.mjs --strict

  # Lot 71E (ticket « T4 v2/v3 fiabilisation », exception PO) : scénarios
  # E2E T4 critiques sur PostgreSQL 16 réel (modèle simulé, aucun appel
  # réseau). Le harnais crée puis supprime sa propre base (verebona_e2e_*).
  e2e-t4:
    name: E2E T4 critiques (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - name: Installation
        run: npm ci
      - name: Scénarios E2E T4 critiques (PostgreSQL 16)
        run: npm run test:e2e:t4

  e2e-cil:
    name: E2E CIL / diagnostics B6 (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
