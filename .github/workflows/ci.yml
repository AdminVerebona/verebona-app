          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      # Lot 100C (CVE-2026-111497) : version exacte corrigée + contrôle bloquant.
      - name: Runtime Node (≥ 24.22.1, CVE-2026-111497)
        run: node scripts/check-node-runtime.mjs
      - name: Installation
        run: npm ci
      - name: Scénarios E2E CIL B6 et diagnostics (lots 69, 70B, 75A)
        run: npm run test:e2e:cil

  e2e-mascotte-t6:
    name: E2E mascotte et T6 (PostgreSQL 16)
