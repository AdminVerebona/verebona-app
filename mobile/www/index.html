<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Lot 108G : coque LOCALE minimale du mode distant (cible V1).
       Capacitor ouvre directement l'origine de l'environnement (`server.url`) ;
       cette page n'est affichée que si l'ouverture passe par la coque (iOS
       exige un fichier de démarrage local). Elle ne contient AUCUNE donnée ni
       interface métier : elle renvoie vers l'accueil de l'environnement, ou
       vers la page « Connexion Internet indisponible ». -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Verebona</title>
  <style>html, body { margin: 0; height: 100%; background: #F8F6F1; }</style>
</head>
<body>
  <script src="app-config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
